<link rel="stylesheet" href="../assets/vendor/leaflet/leaflet.css" />
<script src="../assets/vendor/leaflet/leaflet.js"></script>

<style>
.travel-map-heading {
    margin: 1.5rem 0 1rem;
    font-size: 1.75rem;
    color: var(--primary-color);
}

#map {
    width: 100%;
    height: 500px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 35px rgba(15, 23, 42, 0.15);
    border: 1px solid rgba(37, 99, 235, 0.12);
}

.world-map {
    margin-bottom: 2rem;
}

.travel-marker-wrapper {
    background: transparent !important;
    border: none !important;
}

.travel-marker {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--primary-color, #2563eb);
    border: 2px solid #ffffff;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
}

.leaflet-popup-content-wrapper {
    border-radius: 12px;
}

.leaflet-popup-content {
    margin: 10px 12px;
    line-height: 1.5;
}

.leaflet-popup-content strong {
    display: block;
    margin-bottom: 4px;
    color: var(--primary-color);
    font-size: 1rem;
}

.leaflet-popup-content .popup-date {
    display: block;
    font-size: 0.8rem;
    color: var(--text-light);
    margin-bottom: 6px;
}

.leaflet-popup-content .popup-description {
    margin: 0;
    color: var(--text-dark);
}

@media (max-width: 768px) {
    #map {
        height: 380px;
        border-radius: 14px;
    }
}
</style>

<script>
function initTravelMap() {
    if (typeof window.L === 'undefined') {
        const existingLeafletScript = document.querySelector('script[src*="leaflet.min.js"]');

        if (existingLeafletScript) {
            existingLeafletScript.addEventListener('load', () => initTravelMap(), { once: true });
        } else {
            const leafletScript = document.createElement('script');
            leafletScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
            leafletScript.onload = () => initTravelMap();
            leafletScript.onerror = () => console.error('Leaflet failed to load.');
            document.head.appendChild(leafletScript);
        }

        return;
    }

    // Add new trips here later by copying this structure:
    // { name: 'City, Country', coords: [lat, lng], date: 'Month Year', description: 'Short note' }
    const myTravels = [
        {
            name: 'Luhuo, China',
            coords: [31.4500, 100.7000],
            date: 'Summer 2023',
            description: '________'
        },
        {
            name: 'Chengdu, China',
            coords: [30.5728, 104.0668],
            date: 'Summer 2023',
            description: 'Sichuan cuisine, pandas, and a city with a laid-back vibe.'
        },
        {
            name: 'Tokyo, Japan',
            coords: [35.6762, 139.6503],
            date: 'Summer 2023',
            description: 'Neon nights, sushi, and a city that never seems to sleep.'
        },
        {
            name: 'Chongqing, China',
            coords: [29.5630, 106.5508],
            date: 'Summer 2023',

        },
        {
            name: 'Suzhou, China',
            coords: [31.8206, 120.5843],

            description: 'Classical gardens, silk, and a city with a rich cultural heritage.'
        },
        {

            description: '____'
        },
        {
            name: 'London, UK',
            coords: [51.5074, -0.1278],
            date: 'Summer 2025',
            description: '____'
        },
        {
            name: 'Oxford, UK',
            coords: [51.7520, -1.2577],
            date: 'Summer 2025',
            description: '____'
        },
        {
            name: 'San Juan, Puerto Rico',
            coords: [18.4663, -66.1057],
            date: 'Winter 2023',
            description: '____'
        },
        {
            name: 'Miami, USA',
            coords: [25.7617, -80.1918],
            date: '___',
            description: '____'
        },
        {
            name: 'Washington D.C., USA',
            coords: [38.9072, -77.0369],
            date: 'Spring 2024',
            description: '____'
        },
        {
            name: 'Baltimore, USA',
            coords: [39.2904, -76.6122],
            date: 'Spring 2024',
            description: '____'
        },
        {
            name: 'Seattle, USA',

        }
    ];

    const map = window.L.map('map', {
        zoomControl: true,
        scrollWheelZoom: true
    }).setView([20, 0], 2);

    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }).addTo(map);

    const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const markerIcon = window.L.divIcon({
        html: '<div class="travel-marker"></div>',
        className: 'travel-marker-wrapper',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
    });

    myTravels.forEach(trip => {
        const marker = window.L.marker(trip.coords, {
            title: trip.name,
            icon: markerIcon
        }).addTo(map);

        const popupContent = `
            <div class="leaflet-popup-content">
                <strong>${trip.name}</strong>
                <span class="popup-date">${trip.date}</span>
                <p class="popup-description">${trip.description}</p>
            </div>
        `;

        marker.bindPopup(popupContent);

        if (isDesktop) {
            marker.on('mouseover', () => marker.openPopup());
            marker.on('mouseout', () => marker.closePopup());
        }
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initTravelMap);
} else {
    initTravelMap();
}
</script>
